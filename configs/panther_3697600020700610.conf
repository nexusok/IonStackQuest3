ashmem_release_off            = 0x01434f60
ashmem_show_fdinfo_off        = 0x01425558
ashmem_read_iter_off          = 0x014252e0
configfs_read_file_off        = 0x01433fe8
configfs_write_bin_file_off   = 0x014343b8
copy_splice_read_off          = 0x014254c8
noop_llseek_off               = 0x014226e0

# kernel variables
